# Dockyard runs the Docker socket through the panel. Anyone with panel access has
# root-equivalent control of the host, so treat it accordingly.
#
# Copy .env.example to .env next to this file, or export these in the shell:
#   POSTGRES_PASSWORD   - required, no default is shipped
#   SECRET_KEY          - required, 64 hex chars: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   DOCKYARD_ADMIN_PASSWORD - optional first-boot admin password
#   PUBLIC_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID - optional

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (no default is shipped)}
      POSTGRES_DB: dockyard
    volumes:
      - dockyard-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockyard -d dockyard"]
      interval: 10s
      timeout: 5s
      retries: 10

  panel:
    build:
      context: .
      args:
        # Stamped into the image so the panel can name the commit it is running. deploy/update.sh
        # exports both; a plain `docker compose build` leaves them empty, and the panel then
        # reports the commit as unknown instead of claiming to be current.
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      # The server resolves an unset COOKIE_SECURE to "secure in production" (see resolveCookieSecure
      # in server/src/config.ts). Without this line the value in .env never reaches the container, so
      # a direct-HTTP install gets a Secure session cookie the browser silently drops and sign-in
      # fails in a browser even though curl-based checks pass. Forwarding it lets install.sh choose.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DATABASE_URL: postgres://dockyard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/dockyard
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (64 hex chars)}
      # The panel is itself a container, so a tunnel targeting another container's
      # published port must reach it through the host gateway, not 127.0.0.1.
      TUNNEL_TARGET_HOST: host.docker.internal
      TUNNEL_DATA_DIR: /app/data/tunnels
      # Templates can be supplied as JSON files. This directory is a bind mount (see volumes), so
      # dropping a file on the host adds a template with no rebuild and no restart.
      DOCKYARD_TEMPLATE_DIR: /app/data/templates
      # Templates pulled live from a public repository of template JSON. A template pushed there
      # reaches every install on the next refresh. Empty switches the source off.
      DOCKYARD_TEMPLATES_REPO: ${DOCKYARD_TEMPLATES_REPO:-dockyardapp/dockyard-templates}
      DOCKYARD_TEMPLATES_BRANCH: ${DOCKYARD_TEMPLATES_BRANCH:-main}
      DOCKYARD_TEMPLATES_DIR: /app/data/templates-remote
      DOCKYARD_TEMPLATES_REFRESH_MINUTES: ${DOCKYARD_TEMPLATES_REFRESH_MINUTES:-15}
      DOCKYARD_TEMPLATES_TOKEN: ${DOCKYARD_TEMPLATES_TOKEN:-}
      CLOUDFLARED_BIN: /usr/local/bin/cloudflared
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      DOCKYARD_ADMIN_EMAIL: ${DOCKYARD_ADMIN_EMAIL:-admin@dockyard.local}
      DOCKYARD_ADMIN_PASSWORD: ${DOCKYARD_ADMIN_PASSWORD:-}
      # Version and update checks. The repository may stay private: set DOCKYARD_UPDATE_TOKEN to
      # a read-only token, or open the repository and leave it empty.
      DOCKYARD_UPDATE_REPO: ${DOCKYARD_UPDATE_REPO:-dockyardapp/dockyard}
      DOCKYARD_UPDATE_BRANCH: ${DOCKYARD_UPDATE_BRANCH:-main}
      DOCKYARD_UPDATE_TOKEN: ${DOCKYARD_UPDATE_TOKEN:-}
      DOCKYARD_UPDATE_ENABLED: ${DOCKYARD_UPDATE_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The socket is root:docker 0660 on a stock host, and the image runs as uid
    # and gid 1001, so the panel cannot open it without being added to the
    # host's docker group. Required, because a wrong guess fails at the first
    # API call rather than at start-up.
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the host docker group id: export DOCKER_GID=$(getent group docker | cut -d: -f3)}"
    ports:
      # The panel listens on 8000 inside the container and is published on 8000 by default. The one
      # exception is a tunnel: a quick or named cloudflared tunnel expects to reach the panel on
      # plain port 80, so set PANEL_PORT=80 in that case and point the tunnel at 127.0.0.1:80.
      #
      # PANEL_BIND is the address side. 0.0.0.0 is the default and is reachable from anywhere the
      # host is; 127.0.0.1 keeps the panel to the host itself. This matters more than usual here:
      # the panel mounts the Docker socket, so the published address is a root-equivalent door.
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-8000}:8000"
    volumes:
      # Docker control plane. The panel user needs read/write on this socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Named-tunnel credentials and cloudflared configs.
      - dockyard-data:/app/data
      # The update spool is a bind mount rather than a volume, because the host-side updater in
      # deploy/update.sh has to read the request the panel writes here and publish its status back.
      - ./data/update:/app/data/update
      # Template files. A bind mount for the same reason: the operator drops a *.json file here on
      # the host and the panel picks it up on the next read, with no rebuild and no restart. See
      # deploy/template-examples/ for files to copy in.
      - ./data/templates:/app/data/templates

  # Opt-in TLS reverse proxy. Gated on the "proxy" profile, so COMPOSE_PROFILES=proxy in .env (or
  # `--profile proxy`) brings it up and a bare `docker compose up -d` leaves it down. Compose reads
  # COMPOSE_PROFILES from .env itself, so install.sh and deploy/update.sh turn the proxy on and off
  # by writing one variable and neither script has to know the proxy exists.
  nginx:
    image: nginx:alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - panel
    ports:
      # The one intended public door when the profile is on. Set PANEL_BIND=127.0.0.1 alongside it:
      # the panel mounts the Docker socket, so its own published port is a root-equivalent door and
      # must not stay reachable from outside once nginx is in front.
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      # install.sh renders one of deploy/nginx/*.template here. Read-only: nothing in the container
      # has any reason to rewrite the proxy config, and a compromised nginx should not be able to.
      - ./data/nginx/dockyard.conf:/etc/nginx/conf.d/default.conf:ro
      # The certificate pair. gen-cert.sh writes a self-signed one here; a Let's Encrypt renewal
      # writes the issued one. Read-only for the same reason.
      - ./data/nginx/certs:/etc/nginx/certs:ro
      # ACME webroot. certbot writes the HTTP-01 challenge here on the host and nginx only reads it,
      # so this mount is read-only too.
      - ./data/nginx/www:/var/www/certbot:ro

volumes:
  dockyard-pg:
  dockyard-data:
